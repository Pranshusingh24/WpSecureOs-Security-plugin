name: MaxSafe Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, json, mbstring, curl
          coverage: none

      - name: Run Quality Gate Tests
        run: |
          if [ -f tests/run-tests.php ]; then
            php tests/run-tests.php
          else
            echo "Skipping quality gate tests (tests/ excluded from repository)"
          fi

      - name: Build Production WordPress Plugin ZIP
        run: |
          mkdir -p dist/maxsafe
          
          # Copy production files and folders
          cp maxsafe.php dist/maxsafe/
          cp uninstall.php dist/maxsafe/
          cp readme.txt dist/maxsafe/
          cp composer.json dist/maxsafe/
          cp -r assets dist/maxsafe/
          cp -r includes dist/maxsafe/
          cp -r templates dist/maxsafe/
          cp -r languages dist/maxsafe/
          
          # Create zip archive from dist directory
          cd dist
          zip -r ../maxsafe.zip maxsafe
          cd ..
          
          # Compute cryptographic SHA-256 checksum
          sha256sum maxsafe.zip > checksums.sha256
          echo "Release archive created: maxsafe.zip"
          cat checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            maxsafe.zip
            checksums.sha256
          name: MaxSafe ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
